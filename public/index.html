<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UMKM Marketplace Foundation</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f7f7f7; color: #222; }
    header { background: #111827; color: #fff; padding: 28px 18px; }
    main { max-width: 980px; margin: 0 auto; padding: 18px; }
    .card { background: #fff; border-radius: 16px; padding: 18px; margin: 14px 0; box-shadow: 0 8px 24px rgba(0,0,0,.06); }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    button { background: #f97316; color: #fff; border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 700; cursor: pointer; }
    pre { background: #111827; color: #e5e7eb; padding: 14px; border-radius: 12px; overflow: auto; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>UMKM Marketplace Foundation</h1>
    <p>Fondasi marketplace multi-vendor: seller, produk, ongkir, payment, COD, chat, pixel event.</p>
  </header>

  <main>
    <section class="card">
      <h2>Produk Aktif</h2>
      <button onclick="loadProducts()">Muat Produk</button>
      <div id="products" class="grid"></div>
    </section>

    <section class="card">
      <h2>Simulasi Checkout</h2>
      <p>Checkout produk pertama dengan metode VA.</p>
      <button onclick="checkout()">Checkout Simulasi</button>
      <pre id="result">Belum ada hasil.</pre>
    </section>
  </main>

  <script>
    async function loadProducts() {
      const response = await fetch('/api/products');
      const data = await response.json();
      document.getElementById('products').innerHTML = data.products.map(product => `
        <article class="card">
          <h3>${product.name}</h3>
          <p>Kategori: ${product.category}</p>
          <p>Harga: Rp${product.price.toLocaleString('id-ID')}</p>
          <p>Stok: ${product.stock}</p>
        </article>
      `).join('');
    }

    async function checkout() {
      const products = await fetch('/api/products').then(res => res.json());
      const firstProduct = products.products[0];

      const response = await fetch('/api/checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          customerName: 'Customer Demo',
          customerPhone: '081234567890',
          destinationCity: 'Jakarta',
          paymentMethod: 'VA',
          items: [{ productId: firstProduct.id, qty: 1 }]
        })
      });

      const data = await response.json();
      document.getElementById('result').textContent = JSON.stringify(data, null, 2);
      loadProducts();
    }

    loadProducts();
  </script>
</body>
</html>
