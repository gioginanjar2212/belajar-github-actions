name: AI Project Autopilot CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'codex/**'

jobs:
  test:
    name: npm ci and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run CI checks
        run: npm run ci
