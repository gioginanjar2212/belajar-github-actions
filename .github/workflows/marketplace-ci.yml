name: AI Project Autopilot Legacy CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'codex/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ambil isi repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependency
        run: npm install

      - name: Seed data autopilot
        run: npm run seed

      - name: Jalankan automated test
        run: npm test
        env:
          NODE_ENV: test

      - name: Buat report CI
        if: always()
        run: |
          echo "AI PROJECT AUTOPILOT CI REPORT" > autopilot-ci-report.txt
          echo "================================" >> autopilot-ci-report.txt
          echo "Repository: ${{ github.repository }}" >> autopilot-ci-report.txt
          echo "Branch: ${{ github.ref_name }}" >> autopilot-ci-report.txt
          echo "Commit: ${{ github.sha }}" >> autopilot-ci-report.txt
          echo "Run ID: ${{ github.run_id }}" >> autopilot-ci-report.txt
          echo "Status: lihat job log untuk detail test" >> autopilot-ci-report.txt

      - name: Upload report CI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-ci-report
          path: autopilot-ci-report.txt
