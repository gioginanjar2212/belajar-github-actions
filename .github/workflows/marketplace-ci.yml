name: Marketplace Foundation CI

on:
  push:
    branches:
      - main
      - feature/marketplace-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-marketplace:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil isi repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependency
        run: npm install

      - name: Seed data marketplace
        run: npm run seed

      - name: Jalankan automated test
        run: npm test

      - name: Buat report CI
        if: always()
        run: |
          echo "MARKETPLACE FOUNDATION CI REPORT" > marketplace-ci-report.txt
          echo "================================" >> marketplace-ci-report.txt
          echo "Repository: ${{ github.repository }}" >> marketplace-ci-report.txt
          echo "Branch: ${{ github.ref_name }}" >> marketplace-ci-report.txt
          echo "Commit: ${{ github.sha }}" >> marketplace-ci-report.txt
          echo "Run ID: ${{ github.run_id }}" >> marketplace-ci-report.txt
          echo "Status: lihat job log untuk detail test" >> marketplace-ci-report.txt

      - name: Upload report CI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-ci-report
          path: marketplace-ci-report.txt
